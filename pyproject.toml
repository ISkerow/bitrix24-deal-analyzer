[tool.pytest.ini_options]
# Чтобы `pytest` находил пакет src так же, как `python -m pytest`.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# legacy/ — исходные скрипты с реальными данными, в репозиторий не входят.
extend-exclude = ["legacy"]

[tool.ruff.lint]
# К стандартному набору (E4, E7, E9, F) добавлены только правила, которые
# ловят настоящие ошибки, а не стиль:
#   B       — изменяемые значения по умолчанию, ошибки в условиях и циклах
#   PLE/PLW — ошибки и подозрительные конструкции (pylint)
#   RUF006  — «висячие» asyncio-задачи
#   DTZ     — даты без часового пояса (у проекта всё завязано на поясе клиента)
# Стилистические наборы (E501 длина строки, I сортировка импортов, D докстринги
# и т. п.) не включены намеренно: на работу программы они не влияют.
extend-select = ["B", "PLE", "PLW", "RUF006", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Генератор имитирует CSV из интерфейса Битрикс24, где время записано без пояса;
# prepare() сам считает его временем клиента (CLIENT_TZ). Так задумано.
"generate_sample.py" = ["DTZ001"]
