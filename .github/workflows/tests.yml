name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pip-audit ruff
      # Известные уязвимости в зависимостях проекта.
      - run: pip-audit -r requirements.txt
      # Только правила, ловящие ошибки (настройки — в pyproject.toml).
      - run: ruff check .
      - run: pytest -v
